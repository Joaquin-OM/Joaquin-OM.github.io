    --text-white: #FFFFFF;
    --text-primary: #F3F4F6;
    --text-secondary: #9CA3AF;
    --text-muted: #6B7280;
    --green: #10B981;
    --green-bg: rgba(16, 185, 129, 0.12);
    --blue: #3B82F6;
    --amber: #F59E0B;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
    padding-bottom: 80px;
  }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .crm-header {
    background: rgba(17, 19, 24, 0.92);
    backdrop-filter: blur(14px);

    position: sticky;
    top: 0;
    z-index: 100;
    padding: 16px 0;
    margin-bottom: 24px;
  }
  .crm-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .brand-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-white);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-badge {
    font-size: 0.7rem;
    font-weight: 600;
    background: rgba(255,255,255,0.08);
    padding: 3px 8px;
    border-radius: 4px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .kpi-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .kpi-val { font-size: 2rem; font-weight: 800; color: var(--text-white); line-height: 1; }
  .kpi-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: 6px; }
  .controls-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .search-input-wrap {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    gap: 10px;
  }
  .search-input-wrap input {
    background: transparent;
    border: none;
    color: #fff;
    width: 100%;
    outline: none;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-pill {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-pill:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .filter-pill.active {
    background: var(--text-white);
    color: #090A0D;
    border-color: var(--text-white);
  }
  .leads-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }
  .lead-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: all 0.18s;
  }
  .lead-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
  }
  .lead-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .lead-name { font-size: 1.1rem; font-weight: 700; color: var(--text-white); line-height: 1.25; }
  .sector-badge {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    border: 1px solid var(--border);

    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: #CBD5E1;
    margin-bottom: 14px;
  }
  .lead-audit-label {
    font-size: 0.68rem;
    font-weight: 700;
    color: #F87171;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;

    font-size: 0.75rem;

    align-items: center;

  .lead-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 0.84rem;
    font-weight: 600;

    text-decoration: none;
    border: none;

    bottom: 24px;
    right: 24px;
    background: #10B981;
    color: #FFFFFF;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;

    pointer-events: none;

    function getLeadStatus(id) {
      return localStorage.getItem('crm_status_' + id) || 'pendiente';
    }

    function setLeadStatus(id, status) {
      localStorage.setItem('crm_status_' + id, status);
      updateKPIs();

    function getLeadNotes(id) {
      return localStorage.getItem('crm_notes_' + id) || '';
    }

    function setLeadNotes(id, notes) {
      localStorage.setItem('crm_notes_' + id, notes);
    }

    function copyPitch(id) {
      const lead = LEADS.find(l => l.id === id);
      if (!lead) return;
      navigator.clipboard.writeText(lead.pitch).then(() => {
        showToast("✓ Mensaje copiado al portapapeles");
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function handleWhatsAppClick(id) {
      const current = getLeadStatus(id);
      if (current === 'pendiente') {
        setLeadStatus(id, 'contactado');
        const sel = document.getElementById('status-select-' + id);
        if (sel) sel.value = 'contactado';
      }
      showToast("✓ Abriendo WhatsApp Web con mensaje listo");
    }

    function handleEmailClick(id) {
      const current = getLeadStatus(id);
      if (current === 'pendiente') {
        setLeadStatus(id, 'contactado');
        const sel = document.getElementById('status-select-' + id);
        if (sel) sel.value = 'contactado';
      }
      showToast("✓ Abriendo borrador de email");
    }

    function setSectorFilter(sec) {
      currentSector = sec;
      document.querySelectorAll('#sectorFilters .filter-pill').forEach(p => {
        p.classList.remove('active');

    }

    function renderLeads() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('leadsGrid');
      
      const filtered = LEADS.filter(lead => {
        const matchesSector = (currentSector === 'all') || (lead.sector.toLowerCase().includes(currentSector.toLowerCase()));
        const matchesQuery = !query || 
          lead.name.toLowerCase().includes(query) || 
          lead.zone.toLowerCase().includes(query) || 
          lead.sector.toLowerCase().includes(query);
        return matchesSector && matchesQuery;
      });

      grid.innerHTML = filtered.map(lead => {
        const status = getLeadStatus(lead.id);
        const notes = getLeadNotes(lead.id);
        const cleanPhone = getCleanPhone(lead.phone);
        const waUrl = cleanPhone ? 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(lead.pitch) : '#';
        const mailSubject = encodeURIComponent('Propuesta de modernización web y reservas directas para ' + lead.name + ' — Joaquín Oses');
        const mailBody = encodeURIComponent(lead.pitch + "\n\nPuede consultar el dossier de servicios en línea: https://joaquin-om.github.io/assets/Dossier_Servicios_Joaquin_Oses_2026.pdf");
        const mailUrl = lead.email ? 'mailto:' + lead.email + '?subject=' + mailSubject + '&body=' + mailBody : '#';

        return `
          <div class="lead-card" id="lead-card-${lead.id}">
            <div class="lead-top">
              <h3 class="lead-name">${lead.name}</h3>
              <span class="sector-badge">${lead.sector}</span>
            </div>

            <div class="lead-meta">
              <span>📍 ${lead.zone}</span>
              ${lead.web ? '<span>🌐 <a href="https://' + lead.web + '" target="_blank" style="color: #9CA3AF; text-decoration: none;">' + lead.web + '</a></span>' : ''}
            </div>

            <div class="lead-audit">
              <span class="lead-audit-label">Auditoría web flash:</span>
              ${lead.audit}
            </div>

            <div class="lead-demo">
              <i data-lucide="play" style="width: 13px; height: 13px; color: #10B981;"></i>
              <span>Demo sugerida: <a href="${lead.demoUrl}" target="_blank">${lead.demoName}</a></span>
            </div>

            <div class="lead-actions">
              ${cleanPhone ? `
                <a href="${waUrl}" target="_blank" class="btn btn-whatsapp" onclick="handleWhatsAppClick(${lead.id})">
                  <i data-lucide="message-circle" style="width: 16px; height: 16px;"></i>
                  <span>Abrir WhatsApp con mensaje listo</span>
                </a>
              ` : ''}

              ${lead.email ? `
                <a href="${mailUrl}" class="btn btn-email" onclick="handleEmailClick(${lead.id})">
                  <i data-lucide="mail" style="width: 15px; height: 15px;"></i>
                  <span>Abrir Email con mensaje listo</span>
                </a>
              ` : ''}

              <button class="btn btn-copy" onclick="copyPitch(${lead.id})">
                <i data-lucide="copy" style="width: 12px; height: 12px;"></i>
                <span>Copiar texto del mensaje</span>
              </button>

              <div class="status-select-wrap">
                <span>Estado:</span>
                <select id="status-select-${lead.id}" class="status-select" onchange="setLeadStatus(${lead.id}, this.value)">
                  <option value="pendiente" ${status === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                  <option value="contactado" ${status === 'contactado' ? 'selected' : ''}>📤 Contactado</option>
                  <option value="respondido" ${status === 'respondido' ? 'selected' : ''}>💬 Ha Respondido</option>
                  <option value="reunion" ${status === 'reunion' ? 'selected' : ''}>📅 Reunión Agendada</option>
                  <option value="descartado" ${status === 'descartado' ? 'selected' : ''}>❌ Descartado</option>
                </select>
              </div>

              <input 
                type="text" 
                placeholder="Notas de seguimiento..." 
                value="${notes}" 
                onchange="setLeadNotes(${lead.id}, this.value)"
                style="margin-top: 6px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 0.76rem; outline: none;"
              />
            </div>
          </div>
        `;
      }).join('');

      if (window.lucide) {
        window.lucide.createIcons();
      }

      updateKPIs();
    }

    function updateKPIs() {
      let contacted = 0;
      let responded = 0;
      let meetings = 0;

      LEADS.forEach(l => {
        const s = getLeadStatus(l.id);
        if (s === 'contactado') contacted++;
        else if (s === 'respondido') { contacted++; responded++; }
        else if (s === 'reunion') { contacted++; responded++; meetings++; }
      });

      document.getElementById('kpiTotal').textContent = LEADS.length;
      document.getElementById('kpiContacted').textContent = contacted;
      document.getElementById('kpiContactedPct').textContent = Math.round((contacted / LEADS.length) * 100) + '% enviado';
      document.getElementById('kpiResponses').textContent = responded;
      document.getElementById('kpiMeetings').textContent = meetings;
    }

    function exportData() {
      let csv = "ID,Nombre,Sector,Zona,Telefono,Email,Web,Estado,Notas\n";
      LEADS.forEach(l => {
        const s = getLeadStatus(l.id);
        const n = getLeadNotes(l.id).replace(/"/g, '""');
        csv += `"${l.id}","${l.name}","${l.sector}","${l.zone}","${l.phone}","${l.email}","${l.web}","${s}","${n}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'prospeccion_mallorca_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLeads();
    });
  </script>
</body>
</html>
